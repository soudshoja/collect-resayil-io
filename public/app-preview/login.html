<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Resayil</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .phone-frame {
            width: 375px;
            height: 812px;
            background: #111b21;
            border-radius: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            border: 12px solid #000;
            position: relative;
        }

        .notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 30px;
            background: #000;
            border-radius: 0 0 40px 40px;
            z-index: 100;
        }

        .screen {
            width: 100%;
            height: 100%;
            background: #111b21;
            overflow-y: auto;
            overflow-x: hidden;
            padding-top: 0;
        }

        .content {
            padding: 60px 32px 32px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo {
            width: 100px;
            height: 100px;
            background: #00a884;
            border-radius: 24px;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
        }

        .title {
            font-size: 32px;
            font-weight: bold;
            color: #e9edef;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 18px;
            color: #8696a0;
            margin-bottom: 4px;
        }

        .description {
            font-size: 14px;
            color: #8696a0;
        }

        .form {
            margin-top: 48px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .input-field {
            display: flex;
            align-items: center;
            background: #1f2c34;
            border: 1px solid #2a3942;
            border-radius: 12px;
            padding: 12px 12px;
            gap: 12px;
        }

        .input-icon {
            color: #8696a0;
            font-size: 20px;
            width: 20px;
            height: 20px;
        }

        input {
            flex: 1;
            background: transparent;
            border: none;
            color: #e9edef;
            font-size: 16px;
            outline: none;
        }

        input::placeholder {
            color: #8696a0;
        }

        .forgot-password {
            text-align: right;
            margin-bottom: 24px;
            margin-top: 8px;
        }

        .forgot-password a {
            color: #00a884;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }

        .login-btn {
            width: 100%;
            height: 52px;
            background: #00a884;
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        .login-btn:hover {
            background: #008069;
        }

        .login-btn:active {
            background: #006a55;
        }

        .register-link {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: #8696a0;
        }

        .register-link a {
            color: #00a884;
            text-decoration: none;
            font-weight: 600;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .error {
            color: #ea4335;
            font-size: 14px;
            margin-bottom: 12px;
            margin-top: -8px;
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="notch"></div>
        <div class="screen">
            <div class="content">
                <div class="logo-container">
                    <div class="logo">💬</div>
                    <div class="title">Resayil</div>
                    <div class="subtitle">Welcome back</div>
                    <div class="description">Login to your account</div>
                </div>

                <div class="form">
                    <div class="form-group">
                        <div class="input-field">
                            <span class="input-icon">✉️</span>
                            <input type="email" placeholder="Email address">
                        </div>
                    </div>

                    <div class="form-group">
                        <div class="input-field">
                            <span class="input-icon">🔒</span>
                            <input type="password" placeholder="Password">
                            <span class="input-icon" style="cursor: pointer;">👁️</span>
                        </div>
                    </div>

                    <div class="forgot-password">
                        <a href="#">Forgot password?</a>
                    </div>

                    <button class="login-btn">Login</button>

                    <div class="register-link">
                        Don't have an account? <a href="#">Register</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
