<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Resayil</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .phone-frame {
            width: 375px;
            height: 812px;
            background: #111b21;
            border-radius: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            border: 12px solid #000;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 30px;
            background: #000;
            border-radius: 0 0 40px 40px;
            z-index: 100;
        }

        .status-bar {
            height: 44px;
            background: #1f2c34;
            display: flex;
            align-items: center;
            padding: 0 16px;
            padding-top: 16px;
        }

        .app-bar {
            background: #1f2c34;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #233138;
        }

        .app-bar h1 {
            font-size: 20px;
            font-weight: bold;
            color: #e9edef;
        }

        .content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .profile-header {
            padding: 32px 16px 24px;
            text-align: center;
        }

        .avatar-large {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00a884 0%, #008069 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 56px;
            margin: 0 auto 24px;
            position: relative;
        }

        .camera-btn {
            position: absolute;
            bottom: 4px;
            right: 4px;
            width: 40px;
            height: 40px;
            background: #00a884;
            border-radius: 50%;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .profile-field {
            padding: 12px 16px;
            border-bottom: 1px solid #233138;
            display: flex;
            gap: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .profile-field:hover {
            background: rgba(0, 168, 132, 0.05);
        }

        .field-icon {
            width: 40px;
            height: 40px;
            background: rgba(0, 168, 132, 0.15);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #00a884;
            font-size: 20px;
            flex-shrink: 0;
        }

        .field-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .field-label {
            color: #8696a0;
            font-size: 12px;
            margin-bottom: 4px;
        }

        .field-value {
            color: #e9edef;
            font-size: 14px;
            font-weight: 500;
        }

        .field-arrow {
            color: #8696a0;
            font-size: 20px;
            display: flex;
            align-items: center;
        }

        .section-divider {
            height: 8px;
            background: #0b141a;
            margin: 4px 0;
        }

        .bottom-nav {
            height: 80px;
            background: #1f2c34;
            border-top: 1px solid #233138;
            display: flex;
            justify-content: space-around;
            align-items: flex-start;
            padding-top: 8px;
            padding-bottom: 16px;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            flex: 1;
            cursor: pointer;
            color: #8696a0;
            font-size: 24px;
        }

        .nav-item.active {
            color: #00a884;
        }

        .nav-label {
            font-size: 11px;
            color: inherit;
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="notch"></div>
        <div class="status-bar"></div>

        <div class="app-bar">
            <h1>Profile</h1>
        </div>

        <div class="content">
            <div class="profile-header">
                <div class="avatar-large">
                    U
                    <button class="camera-btn">📷</button>
                </div>
            </div>

            <div class="profile-field">
                <div class="field-icon">👤</div>
                <div class="field-content">
                    <div class="field-label">Name</div>
                    <div class="field-value">User Account</div>
                </div>
                <div class="field-arrow">›</div>
            </div>

            <div class="profile-field">
                <div class="field-icon">📝</div>
                <div class="field-content">
                    <div class="field-label">About</div>
                    <div class="field-value">Hi! I'm using Resayil</div>
                </div>
                <div class="field-arrow">›</div>
            </div>

            <div class="profile-field">
                <div class="field-icon">📞</div>
                <div class="field-content">
                    <div class="field-label">Phone</div>
                    <div class="field-value">+966 50 123 4567</div>
                </div>
                <div class="field-arrow">›</div>
            </div>

            <div class="profile-field">
                <div class="field-icon">✉️</div>
                <div class="field-content">
                    <div class="field-label">Email</div>
                    <div class="field-value">user@resayil.io</div>
                </div>
                <div class="field-arrow">›</div>
            </div>

            <div class="section-divider"></div>

            <div class="profile-field">
                <div class="field-icon">🔐</div>
                <div class="field-content">
                    <div class="field-label">Security</div>
                    <div class="field-value">Two-factor authentication</div>
                </div>
                <div class="field-arrow">›</div>
            </div>

            <div class="profile-field">
                <div class="field-icon">🎯</div>
                <div class="field-content">
                    <div class="field-label">Business Info</div>
                    <div class="field-value">Manage your business details</div>
                </div>
                <div class="field-arrow">›</div>
            </div>
        </div>

        <div class="bottom-nav">
            <div class="nav-item">
                <span>💬</span>
                <div class="nav-label">Chats</div>
            </div>
            <div class="nav-item">
                <span>📞</span>
                <div class="nav-label">Contacts</div>
            </div>
            <div class="nav-item">
                <span>✨</span>
                <div class="nav-label">Status</div>
            </div>
            <div class="nav-item active">
                <span>👤</span>
                <div class="nav-label">Profile</div>
            </div>
            <div class="nav-item">
                <span>⚙️</span>
                <div class="nav-label">Settings</div>
            </div>
        </div>
    </div>
</body>
</html>
