<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status Viewer - Resayil</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .phone-frame {
            width: 375px;
            height: 812px;
            background: #000;
            border-radius: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            border: 12px solid #000;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 30px;
            background: #000;
            border-radius: 0 0 40px 40px;
            z-index: 100;
        }

        .status-viewer {
            width: 100%;
            height: 100%;
            position: relative;
            background: linear-gradient(135deg, #001a1a 0%, #003333 100%);
            display: flex;
            flex-direction: column;
        }

        .progress-bar-container {
            display: flex;
            gap: 4px;
            padding: 12px 12px 0;
            z-index: 10;
        }

        .progress-bar {
            flex: 1;
            height: 2px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-bar.active::after {
            content: '';
            display: block;
            height: 100%;
            background: white;
            animation: fillProgress 5s linear forwards;
        }

        .progress-bar.completed {
            background: white;
        }

        @keyframes fillProgress {
            from {
                width: 0;
            }
            to {
                width: 100%;
            }
        }

        .header {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }

        .avatar-small {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00a884 0%, #008069 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 18px;
        }

        .header-info {
            flex: 1;
        }

        .header-name {
            color: white;
            font-weight: 600;
            font-size: 14px;
        }

        .header-time {
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
        }

        .close-btn {
            background: transparent;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }

        .content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .status-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }

        .status-text {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-size: 48px;
            color: white;
            font-weight: bold;
            text-align: center;
            padding: 32px;
            box-sizing: border-box;
        }

        .nav-area {
            position: absolute;
            top: 0;
            width: 100%;
            height: 100%;
            display: flex;
            z-index: 5;
        }

        .nav-left {
            flex: 1;
            cursor: pointer;
        }

        .nav-right {
            flex: 1;
            cursor: pointer;
        }

        .nav-left:hover, .nav-right:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .react-area {
            position: absolute;
            bottom: 32px;
            left: 16px;
            right: 16px;
            display: flex;
            gap: 12px;
            align-items: center;
            z-index: 10;
        }

        .reaction-btn {
            width: 44px;
            height: 44px;
            background: rgba(0, 168, 132, 0.2);
            border: 1px solid rgba(0, 168, 132, 0.4);
            border-radius: 50%;
            color: #00a884;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .reaction-btn:hover {
            background: rgba(0, 168, 132, 0.3);
            transform: scale(1.1);
        }

        .reaction-btn:active {
            transform: scale(0.95);
        }

        .reply-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 10px 16px;
            color: white;
            font-size: 14px;
            outline: none;
        }

        .reply-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .send-reply-btn {
            width: 36px;
            height: 36px;
            background: #00a884;
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .send-reply-btn:hover {
            background: #008069;
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="notch"></div>

        <div class="status-viewer">
            <div class="progress-bar-container">
                <div class="progress-bar completed"></div>
                <div class="progress-bar active"></div>
                <div class="progress-bar"></div>
                <div class="progress-bar"></div>
                <div class="progress-bar"></div>
            </div>

            <div class="header">
                <div class="avatar-small">A</div>
                <div class="header-info">
                    <div class="header-name">Ahmed Hassan</div>
                    <div class="header-time">2 minutes ago</div>
                </div>
                <button class="close-btn">×</button>
            </div>

            <div class="content">
                <div class="status-text">✨ Great times ahead! 🚀</div>
            </div>

            <div class="nav-area">
                <div class="nav-left"></div>
                <div class="nav-right"></div>
            </div>

            <div class="react-area">
                <button class="reaction-btn">❤️</button>
                <button class="reaction-btn">😂</button>
                <button class="reaction-btn">😲</button>
                <input type="text" class="reply-input" placeholder="Reply...">
                <button class="send-reply-btn">📤</button>
            </div>
        </div>
    </div>
</body>
</html>
