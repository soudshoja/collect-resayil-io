<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacts - Resayil</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .phone-frame {
            width: 375px;
            height: 812px;
            background: #111b21;
            border-radius: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            border: 12px solid #000;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 30px;
            background: #000;
            border-radius: 0 0 40px 40px;
            z-index: 100;
        }

        .status-bar {
            height: 44px;
            background: #1f2c34;
            display: flex;
            align-items: center;
            padding: 0 16px;
            padding-top: 16px;
        }

        .app-bar {
            background: #1f2c34;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #233138;
        }

        .back-btn {
            background: transparent;
            border: none;
            color: #e9edef;
            font-size: 24px;
            cursor: pointer;
        }

        .app-bar h1 {
            font-size: 20px;
            font-weight: bold;
            color: #e9edef;
            flex: 1;
        }

        .search-bar {
            background: #0b141a;
            margin: 8px 16px;
            padding: 8px 12px;
            border-radius: 24px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-bar input {
            flex: 1;
            background: transparent;
            border: none;
            color: #e9edef;
            font-size: 14px;
            outline: none;
        }

        .search-bar input::placeholder {
            color: #8696a0;
        }

        .contact-list {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            border-top: 1px solid #233138;
        }

        .contact-item {
            padding: 12px 16px;
            border-bottom: 1px solid #233138;
            display: flex;
            gap: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .contact-item:hover {
            background: rgba(0, 168, 132, 0.1);
        }

        .avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00a884 0%, #008069 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 22px;
            flex-shrink: 0;
        }

        .contact-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .contact-name {
            font-weight: 600;
            color: #e9edef;
            font-size: 15px;
            margin-bottom: 4px;
        }

        .contact-info {
            color: #8696a0;
            font-size: 13px;
        }

        .contact-action {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: 12px;
        }

        .action-icon {
            width: 32px;
            height: 32px;
            background: rgba(0, 168, 132, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #00a884;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .action-icon:hover {
            background: rgba(0, 168, 132, 0.3);
        }
    </style>
</head>
<body>
